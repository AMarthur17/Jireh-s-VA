<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="jvTitle jvDesc">
  <title id="jvTitle">Jireh's VA Jewelry</title>
  <desc id="jvDesc">Monograma caligráfico dorado sobre el nombre Jireh's VA Jewelry.</desc>

  <defs>
    <linearGradient id="jvGold" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#A87F3F"/>
      <stop offset="14%"  stop-color="#E7CF95"/>
      <stop offset="28%"  stop-color="#B78F49"/>
      <stop offset="44%"  stop-color="#F4E2B2"/>
      <stop offset="58%"  stop-color="#A9813F"/>
      <stop offset="72%"  stop-color="#EFDAA6"/>
      <stop offset="86%"  stop-color="#B08744"/>
      <stop offset="100%" stop-color="#E8D19A"/>
    </linearGradient>
    <linearGradient id="jvGoldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#C9A45C"/>
      <stop offset="50%"  stop-color="#F4E2B2"/>
      <stop offset="100%" stop-color="#C09A52"/>
    </linearGradient>
  </defs>

  <!-- ============ MONOGRAMA ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gran lazo caligráfico + swash -->
    <path d="M1152 196
             C1062 296 956 384 834 434
             C726 478 596 506 470 502
             C346 498 262 466 256 412
             C250 358 322 330 408 340
             C526 354 632 408 716 470"
          stroke="url(#jvGold)" stroke-width="4.5"/>
    <!-- Filete fino + lazo superior -->
    <path d="M614 452
             C642 342 678 206 710 116
             C730 56 780 30 802 52
             C826 76 800 130 752 174
             C706 216 656 282 620 350"
          stroke="url(#jvGold)" stroke-width="4"/>
    <!-- Asta principal (trazo entintado) -->
    <path d="M764 86
             C744 214 702 350 648 462
             C626 508 606 534 596 528
             C586 522 594 490 610 450
             C664 316 718 182 744 82 Z"
          fill="url(#jvGold)" stroke="url(#jvGold)" stroke-width="2"/>
  </g>

  <!-- ============ LOGOTIPO ============ -->
  <g fill="url(#jvGold)" text-anchor="middle">
    <text x="600" y="768"
          font-family="'Playfair Display','Didot','Bodoni MT','Times New Roman',serif"
          font-weight="500" font-size="196" letter-spacing="2">JIREH’S VA</text>
    <text x="600" y="878" fill="url(#jvGoldSoft)"
          font-family="'Jost','Futura','Century Gothic',sans-serif"
          font-weight="300" font-size="62" letter-spacing="29">JEWELRY</text>
  </g>
</svg>
